<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-180.png">
<title>ひとり稽古 · 혼공 일본어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 640px 한 줄 앱 + 하단 탭(레슨·카드·쓰기). 레슨은 전체 화면 오버레이(상단 진행바 · 문제 · 하단 확인/피드백 바). 쓰기는 田자 연습 칸 캔버스 */
:root{
  --bg:#EEF2F1;--surface:#FFFFFF;--sunk:#E2E8E7;--ink:#16212C;--muted:#5B6873;--line:#D3DBDB;--guide:#C9D3D3;
  --ai:#24427A;--ai-deep:#172D57;--ai-soft:#DFE7F4;--on-ai:#FFFFFF;
  --shu:#C4402A;--shu-deep:#93301F;--shu-soft:#F7E1DA;
  --matcha:#3B7A34;--matcha-deep:#2A5A25;--matcha-soft:#DFEFD9;
  --kin:#B97C0C;--kin-soft:#F6EBD2;
  --scrim:rgba(14,22,30,.5);
  --jp:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  --kr:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B;--surface:#18212A;--sunk:#212C36;--ink:#E7ECEE;--muted:#93A0A9;--line:#2B3743;--guide:#344250;
  --ai:#8FAAE0;--ai-deep:#5F7DB8;--ai-soft:#1E2C44;--on-ai:#0C1422;
  --shu:#EA7A61;--shu-deep:#B85540;--shu-soft:#3A221C;
  --matcha:#80C377;--matcha-deep:#5C9554;--matcha-soft:#1C3320;
  --kin:#E8B54E;--kin-soft:#3A2F17;--scrim:rgba(0,0,0,.62);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B;--surface:#18212A;--sunk:#212C36;--ink:#E7ECEE;--muted:#93A0A9;--line:#2B3743;--guide:#344250;
  --ai:#8FAAE0;--ai-deep:#5F7DB8;--ai-soft:#1E2C44;--on-ai:#0C1422;
  --shu:#EA7A61;--shu-deep:#B85540;--shu-soft:#3A221C;
  --matcha:#80C377;--matcha-deep:#5C9554;--matcha-soft:#1C3320;
  --kin:#E8B54E;--kin-soft:#3A2F17;--scrim:rgba(0,0,0,.62);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
p,h1,h2,h3{margin:0}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.jp{font-family:var(--jp)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--jp);font-weight:900;font-size:1.6rem;letter-spacing:.04em;line-height:1.2}
.brand p{font-size:.8rem;color:var(--muted);margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:0 0 auto;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{transform:translateY(2px);border-bottom-width:2px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.stat .v{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:.75rem;font-weight:600;color:var(--muted)}
.stat.fire .v{color:var(--kin)}
.stat.goal .v{color:var(--matcha)}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter>span{display:block;height:100%;background:var(--matcha);border-radius:99px;transition:width .4s ease}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:11px 16px;font-weight:700;cursor:pointer;text-align:center;min-width:0}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ai);border-color:var(--ai-deep);color:var(--on-ai)}
.btn.ok{background:var(--matcha);border-color:var(--matcha-deep);color:var(--on-ai)}
.btn.ng{background:var(--shu);border-color:var(--shu-deep);color:var(--on-ai)}
.btn svg{width:18px;height:18px;flex:0 0 auto}

.go{display:flex;flex-direction:column;gap:8px}
.go-main{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px 18px;text-align:left;width:100%}
.go-main .t{font-size:.76rem;font-weight:700;opacity:.85;letter-spacing:.04em}
.go-main .u{font-family:var(--jp);font-size:1.3rem;font-weight:700}
.go-main .s{font-size:.8rem;opacity:.85;font-weight:500}
.go-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go-row .btn{flex-direction:column;gap:0;padding:10px}
.go-row .btn b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.go-row .btn span{font-size:.78rem;color:var(--muted);font-weight:500}
.go-note,.note{font-size:.8rem;color:var(--muted);line-height:1.6}
.warn-box{font-size:.8rem;line-height:1.6;padding:10px 12px;border-radius:12px;background:var(--kin-soft);color:var(--ink)}
.warn-box b{color:var(--kin)}

.group h2,.sec-h{font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:800}
.group{display:flex;flex-direction:column;gap:10px}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.unit{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:12px;text-align:left;border-radius:16px}
.unit .ul{font-weight:700;font-size:.92rem;line-height:1.35;padding-right:34px}
.unit .um{display:flex;gap:6px;align-items:center;font-size:.74rem;color:var(--muted);font-weight:500;flex-wrap:wrap}
.unit .meter{margin-top:0}
.unit .meter>span{background:var(--ai)}
.unit.done{background:var(--sunk);border-color:var(--sunk)}
.badge{font-size:.68rem;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--kin-soft);color:var(--kin)}
.seal{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:2px solid var(--shu);color:var(--shu);font-family:var(--jp);font-weight:900;font-size:.9rem;display:grid;place-items:center;transform:rotate(-14deg);opacity:.9}
@media (max-width:380px){.units{grid-template-columns:1fr}}

/* 하단 탭 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nav button{border:2px solid transparent;background:none;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--muted);font-size:.74rem;font-weight:700}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ai);background:var(--ai-soft);border-color:var(--ai-soft)}

/* 공통 컨트롤 */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips button,.chk button{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.84rem;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.chips button .jp{font-size:1rem}
.chips button[aria-pressed="true"],.chk button[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft);color:var(--ai)}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.pick{width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;min-width:0}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl-row>*{min-width:0}

.say{flex:0 0 auto;width:48px;height:48px;border-radius:14px;border:2px solid var(--ai-deep);border-bottom-width:4px;background:var(--ai);color:var(--on-ai);display:grid;place-items:center;cursor:pointer;padding:0}
.say svg{width:22px;height:22px}
.say.sm{width:38px;height:38px;border-radius:12px}
.say.sm svg{width:18px;height:18px}
.say:active{transform:translateY(2px);border-bottom-width:2px}

/* 카드 */
.fc{position:relative;min-height:310px;border:2px solid var(--line);border-bottom-width:6px;border-radius:22px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 20px 24px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y;transition:transform .18s ease}
.fc.flip{border-color:var(--ai-soft)}
.fc .st{position:absolute;top:12px;left:14px;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.fc .st.new{background:var(--kin-soft);color:var(--kin)}
.fc .st.ok{background:var(--matcha-soft);color:var(--matcha)}
.fc .st.due{background:var(--shu-soft);color:var(--shu)}
.fc .lv{position:absolute;top:12px;right:14px}
.fc-jp{font-family:var(--jp);font-size:clamp(1.7rem,7.5vw,2.6rem);font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.fc-jp.kana{font-size:6.5rem;line-height:1.05}
.fc-ko{font-size:clamp(1.2rem,5.5vw,1.6rem);font-weight:800;line-height:1.4}
.fc-rd{font-family:var(--jp);font-size:1rem;color:var(--muted)}
.fc-back{display:flex;flex-direction:column;gap:3px;align-items:center;padding-top:12px;border-top:2px dashed var(--line);width:100%}
.fc-back .h{font-size:.95rem;color:var(--muted)}
.fc-back .ko2{font-size:1.15rem;font-weight:800;color:var(--ai)}
.fc-back .jp2{font-family:var(--jp);font-size:1.5rem;font-weight:700}
.fc-tap{font-size:.78rem;color:var(--muted)}
.fc-nav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.fc-nav .mid{display:flex;justify-content:center;gap:8px}
.fc-count{font-size:.85rem;font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.fc-grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc-grade .btn{padding-block:12px}
.btn.auto{width:100%}
.btn.auto[aria-pressed="true"]{background:var(--kin-soft);border-color:var(--kin);color:var(--kin)}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}

/* 쓰기 */
.w-prompt{display:flex;align-items:center;gap:14px}
.w-char{font-family:var(--jp);font-size:3.4rem;font-weight:700;line-height:1;min-width:64px;text-align:center}
.w-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.w-info b{font-size:1.15rem}
.w-info span{font-size:.82rem;color:var(--muted)}
.pad-wrap{position:relative;width:100%;max-width:400px;aspect-ratio:1;margin:0 auto}
.pad{position:absolute;inset:0;width:100%;height:100%;border-radius:20px;background:var(--surface);border:2px solid var(--line);touch-action:none;display:block;cursor:crosshair}
.pad-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pad-svg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pad-svg text{font:700 5px var(--kr)}
.anim path{stroke:var(--ai);stroke-width:5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease forwards}
.model path{stroke:var(--shu);stroke-width:5;opacity:.45}
.anim text,.model text{fill:var(--shu)}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.anim path{animation:none;stroke-dashoffset:0}}
.w-tools{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;max-width:400px;width:100%;margin:0 auto}
.w-res{max-width:400px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px}
.w-res.good{background:var(--matcha-soft)}
.w-res.mid{background:var(--kin-soft)}
.w-res.bad{background:var(--shu-soft)}
.w-res .top-line{display:flex;align-items:baseline;gap:10px}
.w-res .sc{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.w-res.good .sc{color:var(--matcha)}.w-res.mid .sc{color:var(--kin)}.w-res.bad .sc{color:var(--shu)}
.w-res ul{margin:0;padding-left:18px;font-size:.82rem;line-height:1.6}
.w-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.w-sum div{border-radius:12px;padding:6px 4px;text-align:center;background:var(--surface);border:2px solid var(--line)}
.w-sum .jp{font-size:1.6rem;font-weight:700;display:block;line-height:1.2}
.w-sum small{font-size:.74rem;font-weight:800}
.w-sum .good small{color:var(--matcha)}.w-sum .mid small{color:var(--kin)}.w-sum .bad small{color:var(--shu)}

/* 레슨 */
.lesson{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{display:flex;align-items:center;gap:12px;max-width:640px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.l-top .x{border:0;background:none;color:var(--muted);cursor:pointer;width:32px;height:32px;display:grid;place-items:center;padding:0}
.l-top .x svg{width:22px;height:22px}
.l-bar{flex:1;height:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.l-bar>span{display:block;height:100%;width:0;background:var(--matcha);border-radius:99px;transition:width .35s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.combo{font-size:.8rem;font-weight:800;color:var(--kin);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.l-body{flex:1;overflow-y:auto}
.q{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-head h2{font-size:1.15rem;font-weight:800;flex:1;min-width:0}
.tag{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--ai-soft);color:var(--ai)}
.tag.new{background:var(--kin-soft);color:var(--kin)}
.tag.retry{background:var(--shu-soft);color:var(--shu)}
.lv{font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.prompt{display:flex;gap:12px;align-items:flex-start}
.prompt .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.prompt .big{font-family:var(--jp);font-size:clamp(1.5rem,6.5vw,2.1rem);font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.prompt .big.kana{font-size:4.5rem;line-height:1.1}
.prompt .ko{font-size:1.25rem;font-weight:700;line-height:1.45}
.rd{font-family:var(--jp);font-size:.95rem;color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted)}
.listen-pad{display:flex;gap:12px;justify-content:center;padding:18px 0}
.listen-pad .say{width:96px;height:96px;border-radius:24px}
.listen-pad .say svg{width:40px;height:40px}
.listen-pad .say.slow{width:64px;height:64px;border-radius:18px;align-self:flex-end;background:var(--surface);color:var(--ai);border-color:var(--line)}
.listen-pad .say.slow svg{width:26px;height:26px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;justify-content:flex-start;text-align:left;padding:12px 14px;border-radius:14px;width:100%}
.opt .n{flex:0 0 auto;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:var(--muted);font-weight:700}
.opt .c{min-width:0;display:flex;flex-direction:column;gap:1px}
.opt .c .jp{font-size:1.15rem;font-weight:700;overflow-wrap:anywhere}
.opt .c small{font-size:.78rem;color:var(--muted);font-weight:500}
.opt.kana-o .c .jp{font-size:2rem}
.opts.grid2{grid-template-columns:1fr 1fr}
.opt.sel{border-color:var(--ai);background:var(--ai-soft);color:var(--ai)}
.opt.sel .n{border-color:var(--ai);color:var(--ai)}
.opt.right{border-color:var(--matcha);background:var(--matcha-soft);color:var(--matcha)}
.opt.wrong{border-color:var(--shu);background:var(--shu-soft);color:var(--shu)}
.build-ans{min-height:64px;border-bottom:2px solid var(--line);padding:6px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.build-ans:empty::before{content:'아래 조각을 순서대로 눌러요';color:var(--muted);font-size:.85rem;align-self:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{font-family:var(--jp);font-size:1.1rem;font-weight:700;padding:8px 12px;border-radius:12px}
.tile.used{visibility:hidden}
.type-in{width:100%;font-size:1.1rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-height:110px;resize:none}
.type-in:focus{outline:none;border-color:var(--ai)}
.type-help{font-size:.78rem;color:var(--muted)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.pair{padding:12px 10px;border-radius:14px;min-height:56px;width:100%}
.pair.jp{font-size:1.05rem}
.pair.kana-p{font-size:1.6rem}
.pair.sel{border-color:var(--ai);background:var(--ai-soft);color:var(--ai)}
.pair.gone{opacity:.25;pointer-events:none;border-color:var(--matcha)}
.pair.bad{border-color:var(--shu);background:var(--shu-soft)}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:9px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;gap:2px}
.bub.me{margin-left:auto;background:var(--ai-soft);border-color:transparent}
.bub .jp{font-size:1rem;font-weight:700}
.bub small{font-size:.76rem;color:var(--muted)}
.bub.ask{border-style:dashed;background:transparent;color:var(--ai);font-weight:700}

간\n관용구: 青天の霹靂(せいてんの へきれき)=마른하늘에 날벼락. 일상에서도 쓰는 표현이에요.",[["雷","かみなり","카미나리","천둥 / 번개",""],["の","","노","~의, ~것",""],["呼吸","こきゅう","코큐-","호흡",""],["壱","いち","이치","1 (갖은자)",""],["型","かた","카타","어깨",""],["霹靂","へきれき","헤키레키","벼락",""],["一閃","いっせん","잇센","번쩍하는 한순간",""]]],["雷の呼吸 漆ノ型 火雷神","かみなりの こきゅう しちのかた ほのいかづちのかみ","kaminari no kokyuu shichi no kata honoikazuchi no kami","카미나리 노 코큐- 시치 노 카타 호노이카즈치 노 카미","번개의 호흡 제7형 화뢰신 (젠이츠)","word","젠이츠가 스스로 만들어 낸 일곱 번째 기술이에요. 사형 카이가쿠와 싸울 때 처음 써요.\n단어: 漆(しち)=7의 갖은자 (원래는 '옻'이라는 뜻의 한자), 火雷神(ほのいかづちのかみ)=일본 신화에 나오는 번개의 신\n읽기: 雷를 かみなり가 아니라 옛말 いかづち로 읽어요. 신화·고어에서 쓰는 읽기예요.",[["雷","かみなり","카미나리","천둥 / 번개",""],["の","","노","~의, ~것",""],["呼吸","こきゅう","코큐-","호흡",""],["漆","しち","시치","7 (갖은자)",""],["型","かた","카타","어깨",""],["火雷神","ほのいかづちのかみ","호노이카즈치노카미","번개의 신",""]]],["炎の呼吸 壱ノ型 不知火","ほのおの こきゅう いちのかた しらぬい","honoo no kokyuu ichi no kata shiranui","호노- 노 코큐- 이치 노 카타 시라누이","화염의 호흡 제1형 시라누이 (렌고쿠)","word","렌고쿠의 화염의 호흡 첫 번째 기술이에요. 빠르게 돌진하며 베는 기술이에요.\n단어: 炎(ほのお·호노-)=불꽃, 不知火(しらぬい)=규슈 바다에서 밤에 보인다는 신비한 불빛 현상\n읽기: 不知火는 한자 그대로 읽지 않는 특수한 읽기예요. '(누가 켰는지) 모르는 불'이라는 뜻에서 왔어요.",[["炎","ほのお","호노-","불꽃",""],["の","","노","~의, ~것",""],["呼吸","こきゅう","코큐-","호흡",""],["壱","いち","이치","1 (갖은자)",""],["型","かた","카타","어깨",""],["不知火","しらぬい","시라누이","시라누이 (신비한 불빛)",""]]],["獣の呼吸","けだものの こきゅう","kedamono no kokyuu","케다모노 노 코큐-","짐승의 호흡 (이노스케)","word","이노스케가 혼자 만들어 낸 호흡이에요. 산에서 멧돼지에게 길러진 이노스케답게 두 자루 칼을 짐승처럼 휘둘러요.\n단어: 獣(けだもの·케다모노)=짐승\n읽기: 獣는 보통 けもの(케모노)라고 읽어요. けだもの는 '짐승 같은 놈'처럼 거친 느낌이 있어서 이노스케에게 딱 맞는 읽기예요.",[["獣","しし","시시","짐승",""],["の","","노","~의, ~것",""],["呼吸","こきゅう","코큐-","호흡",""]]],["風の呼吸","かぜの こきゅう","kaze no kokyuu","카제 노 코큐-","바람의 호흡 (사네미)","word","풍주 시나즈가와 사네미의 호흡이에요.\n단어: 風(かぜ·카제)=바람\n일상: 風邪(かぜ)=감기도 똑같이 かぜ라고 읽어요. 「風邪をひきました」=감기에 걸렸어요. 한자로 구별해요.",[["風","かぜ","카제","바람",""],["の","","노","~의, ~것",""],["呼吸","こきゅう","코큐-","호흡",""]]],["蟲の呼吸","むしの こきゅう","mushi no kokyuu","무시 노 코큐-","벌레의 호흡 (시노부)","word","충주 코쵸 시노부의 호흡이에요. 힘이 약한 대신 칼끝에 독을 묻혀 찌르는 독특한 기술이에요.\n단어: 蟲(むし·무시)=벌레. 지금은 간단한 한자 虫를 써요.\n일상: 虫歯(むしば)=충치, 弱虫(よわ const PUNCT=/[\s。、．，,.!！?？・「」『』（）()〜~…:：;；"'`]/g;
const strip=s=>String(s||'').replace(PUNCT,'');
function romaNorm(s){s=String(s||'').normalize('NFKC').toLowerCase().replace(/[āâ]/g,'aa').replace(/[īî]/g,'ii').replace(/[ūû]/g,'uu').replace(/[ēê]/g,'ee').replace(/[ōô]/g,'ou').replace(/[^a-z]/g,'');
  return s.replace(/wo/g,'o').replace(/ou|oo/g,'o').replace(/uu/g,'u').replace(/aa/g,'a').replace(/ii/g,'i').replace(/ei|ee/g,'e').replace(/m(?=[bmp])/g,'n').replace(/nn(?![aiueoy])/g,'n').replace(/si/g,'shi').replace(/ti/g,'chi').replace(/tu/g,'tsu').replace(/hu/g,'fu').replace(/zi|di/g,'ji').replace(/du/g,'zu').replace(/(sh|ch|j)y/g,'$1');}
const kanaNorm=s=>toHira(String(s||'').normalize('NFKC')).replace(/[^ぁ-ゖ一-龯々]/g,'').replace(/を/g,'お');
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n]}
function checkTyped(input,it){const hasJ=/[ぁ-ゖァ-ヶ一-龯]/.test(input);let a,targets;
  if(hasJ){a=kanaNorm(input);targets=[kanaNorm(it.r),kanaNorm(it.j)];}else{a=romaNorm(input);targets=[romaNorm(it.m)];}
  if(!a)return {ok:false};let best=1e9,tl=1;for(const t of targets){const d=lev(a,t);if(d<best){best=d;tl=t.length}}
  if(best===0)return {ok:true};if(best<=Math.floor(tl/8))return {ok:true,typo:true};return {ok:false};}

    while(out.length>6){let bi=0,bl=1e9;for(let i=0;i<out.length-1;i++){const l=out[i].length+out[i+1].length;if(l<bl){bl=l;bi=i}}out.splice(bi,2,out[bi]+out[bi+1]);}}

function distract(it,n,key){const val=it[key],seen=new Set([val]),out=[],L0=String(val).length;
  const src=((UM[it.u]||{}).items||ALL).filter(x=>x[key]&&!seen.has(x[key])&&!!x.kana===!!it.kana);
  const cand=shuffle(src).sort((a,b)=>Math.abs(a[key].length-L0)-Math.abs(b[key].length-L0)).slice(0,14);
  for(const x of shuffle(cand)){if(out.length>=n)break;if(seen.has(x[key]))continue;seen.add(x[key]);out.push(x);}
  if(out.length<n)for(const x of shuffle(ALL)){if(out.length>=n)break;if(!!x.kana!==!!it.kana||!x[key]||seen.has(x[key]))continue;seen.add(x[key]);out.push(x);}

function feasible(t,it){switch(t){case 'listen':case 'kListen':return HAS_TTS&&S.set.listen;case 'build':return S.set.build&&chunks(it).length>=2;case 'type':return S.set.type&&!!it.m&&it.m.length<=30;default:return true}}
function makeQ(it,last,retry){const s=st(it.id),b=s?s.b:0;let pool;

let L=null;
function pickItems(mode,unit){const len=S.set.len,t=now();
  if(mode==='review')return ALL.filter(it=>isDue(it.id,t)).sort((a,b)=>st(b.id).w-st(a.id).w||st(a.id).due-st(b.id).due).slice(0,len);
  if(mode==='weak')return shuffle(ALL.filter(it=>isWeak(it.id)).sort((a,b)=>st(b.id).w/st(b.id).n-st(a.id).w/st(a.id).n).slice(0,len*2)).slice(0,len);
  const its=unit.items.filter(it=>!(st(it.id)||{}).skip);
  const due=its.filter(it=>isDue(it.id,t)).sort((a,b)=>st(a.id).due-st(b.id).due);
  const fresh=its.filter(it=>!st(it.id));
  const nd=Math.min(due.length,fresh.length?Math.ceil(len*.4):len);
  let items=due.slice(0,nd).concat(fresh.slice(0,len-nd));

function matchTap(q,ml,mr){const el=ml||mr,side=ml?'l':'r',id=ml?ml.dataset.ml:mr.dataset.mr;if(L.mDone.has(id))return;

function overlap(a,b){let n=0,t=0;for(let i=0;i<a.length;i++)if(a[i]){t++;if(b[i])n++}return t?n/t:0}
function scoreWrite(ch){const user=W.strokes.filter(s=>s.length>0),model=modelPts(ch);
  if(!user.length)return null;const U=bboxNorm(user),M=bboxNorm(model);
  const P=overlap(raster(U,3.5),raster(M,8)),R=overlap(raster(M,3.5),raster(U,8));const shape=P+R?2*P*R/(P+R):0;
  let score=Math.max(0,Math.min(1,(shape-.55)/(.9-.55)))*100;const notes=[];
  notes.push(`모양 일치 ${Math.round(shape*100)}%`);
  const dn=user.length-model.length;
  if(dn){score-=Math.min(36,Math.abs(dn)*12);notes.push(`획 수 ${user.length}획 → 정답은 ${model.length}획`);}else notes.push(`획 수 ${model.length}획 정확해요`);
  if(!dn){let bad=0,rev=0;for(let i=0;i<M.length;i++){const us=U[i][0],ue=U[i][U[i].length-1],ms=M[i][0],me=M[i][M[i].length-1];const d=Math.hypot(us[0]-ms[0],us[1]-ms[1]);
      if(d>.33){if(Math.hypot(us[0]-me[0],us[1]-me[1])<.25&&Math.hypot(ue[0]-ms[0],ue[1]-ms[1])<.25)rev++;else bad++;}}
    if(bad){score-=10;notes.push('획순이 다른 것 같아요. 빨간 번호 순서대로 써 보세요');}
    if(rev){score-=6;notes.push(`${rev}개 획의 방향이 반대예요`);}
    if(!bad&&!rev)notes.push('획순과 방향도 좋아요');}
  return {score:Math.round(Math.max(0,Math.min(100,score))),notes};}
function wCheck(){const ch=W.list[W.i];const r=scoreWrite(ch);if(!r){toast('칸 안에 글자를 써 주세요');return}
  W.checked=r;const k=wKey(ch);const o=S.write[k]||{n:0,best:0};o.n++;o.last=r.score;o.best=Math.max(o.best,r.score);o.t=now();S.write[k]=o;
  W.scores=W.scores.filter(x=>x[0]!==ch);W.scores.push([ch,r.score]);addXP(r.score>=60?3:1);save();renderWrite();if(S.set.auto)say(ch);}
$('#wArea').addEventListener('click',e=>{const t=e.target;const ch=W.list[W.i];
  if(t.closest('#wSay')){if(ch)say(ch)}
  else if(t.closest('#wAnim')){if(!ch)return;W.anim=true;const svg=$('#padSvg');svg.innerHTML='';void svg.offsetWidth;showModel(true);say(ch);}
  else if(t.closest('#wUndo')){W.strokes.pop();drawPad();}
  else if(t.closest('#wClear')){W.strokes=[];$('#padSvg').innerHTML='';drawPad();}
  else if(t.closest('#wCheck'))wCheck();
  else if(t.closest('#wRetry')){wReset();renderWrite();}
  else if(t.closest('#wNext')){W.i++;wReset();renderWrite();if(W.i<W.list.length&&S.set.auto)say(W.list[W.i]);}
  else if(t.closest('#wAgain')){W.list=W.scores.map(x=>x[0]);W.i=0;W.scores=[];wReset();renderWrite();}
  else if(t.closest('#wNextRow')){if(W.row!=='mix'&&W.row!=='weak'){const i=WROWS.findIndex(r=>r[0]===W.row);W.row=WROWS[(i+1)%WROWS.length][0];}wStart();}});
$('#wScript').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.v===W.script)return;W.script=b.dataset.v;wStart();};
$('#wMode').onclick=e=>{const b=e.target.closest('button');if(!b)return;W.mode=b.dataset.v;W.checked=null;W.strokes=[];renderWrite();};
$('#wRows').onclick=e=>{const b=e.target.closest('button');if(!b)return;W.row=b.dataset.v;wStart();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>drawPad())}catch(e){}

/* ---------- 탭 · 키보드 ---------- */
let tab=lsGet('hongong-tab')||'learn';
function setTab(t){if(!['learn','cards','write'].includes(t))t='learn';if(t!=='cards')stopAuto();tab=t;lsSet('hongong-tab',t);
  $('#vLearn').hidden=t!=='learn';$('#vCards').hidden=t!=='cards';$('#vWrite').hidden=t!=='write';
  document.querySelectorAll('.nav [data-tab]').forEach(b=>b.toggleAttribute('aria-current',false)||b.dataset.tab===t&&b.setAttribute('aria-current','page'));
  refreshViews();window.scrollTo(0,0);}
function refreshViews(){if(tab==='learn')renderLearn();else if(tab==='cards'){if(!C.list.length||C.unit.startsWith('__'))buildCards(true);renderCards();}else{if(!W.list.length)wStart();else renderWrite();}}
document.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb&&!e.target.closest('#lesson')){setTab(tb.dataset.tab);return}if(e.target.closest('[data-open-set]'))openSheet();});
document.addEventListener('keydown',e=>{
  if(!$('#sheet').hidden){if(e.key==='Escape')closeSheet();return}
  if(L){const q=L.qs[L.i];
    if(e.key==='Escape'){closeLesson();return}
    if(e.target.id==='tIn'){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(L.state==='ask')check();else next();}return}
    if(e.key==='Enter'){if(e.target.closest&&e.target.closest('button')&&!['nextBtn','checkBtn','againBtn'].includes(e.target.id))return;e.preventDefault();
      if(L.state==='ask')check();else if(L.state==='done')next();else if(L.state==='end')$('#againBtn').click();return}
    if(L.state==='ask'&&q&&q.opts&&/^[1-4]$/.test(e.key)){const b=qv.querySelector(`[data-opt="${+e.key-1}"]`);if(b)b.click();}
    return}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(tab==='cards'){if(e.key==='ArrowRight'){stopAuto();cardGo(1)}else if(e.key==='ArrowLeft'){stopAuto();cardGo(-1)}else if(e.key===' '&&e.target.id!=='fcCard'&&!e.target.closest('button')){e.preventDefault();stopAuto();cardFlip()}else if(e.key==='p'){const it=C.list[C.i];if(it)say(it.j)}}
  if(tab==='write'){if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();W.strokes.pop();drawPad();}else if(e.key==='Enter'&&!e.target.closest('button')){e.preventDefault();if(W.checked)$('#wNext')&&$('#wNext').click();else wCheck();}}});

/* ---------- 설정 ---------- */
function syncSheet(){['setLen','setHint','setGoal'].forEach(id=>{const el=$('#'+id),k=el.dataset.k;el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v)===String(S.set[k])))});
  ['#setTypes','#setTypes2'].forEach(s=>$(s).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',!!S.set[b.dataset.k])));renderSync();}
function openSheet(){stopAuto();syncSheet();$('#bk').value='';$('#reset').textContent='진도 초기화';$('#sheet').hidden=false;}
function closeSheet(){$('#sheet').hidden=true;refreshViews();}
$('#sClose').onclick=closeSheet;
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')return closeSheet();
  const sb=e.target.closest('.seg button');if(sb){const k=sb.parentElement.dataset.k;S.set[k]=k==='hint'?sb.dataset.v:+sb.dataset.v;S.setT=now();save();syncSheet();return}
  const cb=e.target.closest('.chk button');if(cb){S.set[cb.dataset.k]=!S.set[cb.dataset.k];S.setT=now();save();syncSheet();return}});
$('#bkCopy').onclick=()=>{const txt=JSON.stringify(S);$('#bk').value=txt;
  try{navigator.clipboard.writeText(txt).then(()=>toast('진도를 복사했어요'),()=>{$('#bk').select();toast('위 글을 직접 복사하세요')})}catch(e){$('#bk').select();toast('위 글을 직접 복사하세요')}};
$('#bkLoad').onclick=()=>{try{const x=JSON.parse($('#bk').value);if(!x||typeof x.items!=='object')throw 0;S=mergeS(normS(x),S);save();syncSheet();toast('진도를 합쳐서 복원했어요');}catch(e){toast('복원할 수 없는 내용이에요. 복사한 글 전체를 붙여 넣으세요')}};
$('#reset').onclick=e=>{const b=e.currentTarget;if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='정말 지울까요? 한 번 더 누르세요';setTimeout(()=>{b.dataset.arm='';b.textContent='진도 초기화'},4000);return}
  const set=S.set;S=normS({set});S.setT=now();
  if(Sync.doc){Sync.dirty=true;push();}saveLocal();b.dataset.arm='';b.textContent='진도 초기화';toast('진도를 초기화했어요');};

$('#bkSave').hidden=CAP;
$('#bkSave').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='hitori-keiko-'+dkey()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('파일로 저장했어요')}catch(e){toast('저장할 수 없어요. 진도 복사를 써 주세요')}};
$('#bkFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bk').value=String(r.result||'');$('#bkLoad').click();e.target.value=''};r.readAsText(f)};
$('#verNote').textContent='버전 '+APP_VER+(CAP?' · 안드로이드 앱':' · 웹앱');
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('bd')){S.ui.bdOpen=e.target.open;saveLocal();}},true);
let tT=0;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(tT);tT=setTimeout(()=>el.hidden=true,2200)}
setTab(tab);
if(CAP){const App=plug('App');if(App)App.addListener('backButton',()=>{if(!$('#sheet').hidden)return closeSheet();if(L)return closeLesson();if(tab!=='learn')return setTab('learn');App.exitApp()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){stopAuto();stopSay()}});}
else if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='activated'&&hadSW)toast('새 버전으로 업데이트됐어요. 다시 열면 적용돼요')})})}).catch(()=>{})}
const hadSW=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
setTimeout(()=>{if(tab==='learn'&&!L)renderLearn()},1200);
initCloud();
})();
</script>
